name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run check
      - name: Write checksum
        run: sha256sum dist/*.moext > "dist/leonx86.feishu-notifier-${GITHUB_REF_NAME#v}.moext.sha256"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.moext dist/*.sha256 --generate-notes --title "leonx86.feishu-notifier ${GITHUB_REF_NAME#v}"